lexenergy-api:
  build:
    context: ..
    dockerfile: docker/Dockerfile

  restart: unless-stopped

  ports:
    - "8000:8000"

  volumes:
    - ../corpus:/app/corpus
    - ../logs:/app/logs

  env_file:
    - ../.env

  extra_hosts:
    - "host.docker.internal:host-gateway"

  environment:
    QDRANT_HOST: qdrant
    QDRANT_PORT: 6333
    REDIS_HOST: redis
    REDIS_PORT: 6379
    OLLAMA_BASE_URL: http://host.docker.internal:11434

  depends_on:
    - qdrant
    - redis

  deploy:
    resources:
      limits:
        memory: 4g
        cpus: "2"

  command: uvicorn app.main:app --host 0.0.0.0 --port 8000